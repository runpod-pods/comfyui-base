# Example manifest for the ComfyUI tests.
#
# Run with (from the repo root, with runpodctl authenticated + an SSH key
# registered on the Runpod account):
#
#   ./tests/test_images.py tests/comfyui/images.example.yaml comfyui
#
# Two independent ComfyUI flags (see tests/README.md for the full story):
#
#   test_comfyui: true             SMOKE — is ComfyUI up and reachable on
#                                  :8188? Probed in-pod (curl 127.0.0.1:8188)
#                                  and via the public Runpod proxy. Cheap:
#                                  no model download, no GPU work.
#
#   test_comfyui_functional: true  FUNCTIONAL — can it actually generate an
#                                  image? Runs host-side against the public
#                                  proxy URL (no SSH): provisions the model(s)
#                                  from tests/comfyui/models.json via the
#                                  ComfyUI-RunpodDirect node's /server_download
#                                  routes, POSTs tests/comfyui/workflows/
#                                  gsl_starter_1_1.api.json (the "1.1 Starter
#                                  - Text to Image" template) to /prompt,
#                                  polls /history, then asserts a real PNG
#                                  came out. Heavier: pulls a ~2 GB model +
#                                  uses GPU time.
#
# The functional flag IMPLIES the smoke flag — enabling it runs the
# reachability probe first and only spends GPU time if ComfyUI is up. So
# for a full run you only need test_comfyui_functional: true (below). For a
# quick "is it reachable?" run, drop the functional line and keep just
# test_comfyui: true.
comfyui:
    images:
    - runpod/comfyui:cuda13.0
    instances:
    - "RTX A5000"
    - "RTX 4090"
    - "RTX A4000"
    test_comfyui_functional: true
